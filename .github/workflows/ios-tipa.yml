name: Build Aipapa IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v3
      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build IPA
        run: |
          xcodebuild -project Aipapa.xcodeproj -scheme Aipapa -sdk iphoneos -configuration Release clean build
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: Aipapa.ipa
          path: build/Release-iphoneos/Aipapa.ipa
