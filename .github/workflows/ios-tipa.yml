name: iOS IPA Build - Aipapa

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: ./Aipapa

      - name: Generate Xcode Project
        run: xcodegen generate --spec ./Aipapa/project.yml

      - name: Ensure Info.plist exists
        run: |
          mkdir -p ./Aipapa/build/Release-iphoneos/Aipapa.app
          cp ./Aipapa/Info.plist ./Aipapa/build/Release-iphoneos/Aipapa.app/Info.plist

      - name: Archive App
        run: |
          xcodebuild archive \
            -workspace ./Aipapa/Aipapa.xcworkspace \
            -scheme Aipapa \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/build/Aipapa.xcarchive \
            -derivedDataPath $GITHUB_WORKSPACE/build/DerivedData

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $GITHUB_WORKSPACE/build/Aipapa.xcarchive \
            -exportPath $GITHUB_WORKSPACE/build/ipa \
            -exportOptionsPlist ./Aipapa/ExportOptions.plist
